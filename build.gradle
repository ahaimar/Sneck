plugins {
    id 'java'
    id 'application'
}

group = 'org.pack'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'org.pack.Main'
    // The game needs a real display, so never let a headless default reach the app.
    applicationDefaultJvmArgs = ['-Djava.awt.headless=false']
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
